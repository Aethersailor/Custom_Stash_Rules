; Custom_Stash_Rules：归档前最后一次配置校正，不再自动生成或同步。
; COCR 策略基准：cfg/Custom_Clash_Full.ini @ 59d73a28307a37c6fcf3b0dc547ed19bd33f5959
; GeoSite 与 GEOIP 使用 jsDelivr 远程规则；域名/IP 优先使用 MRS，
; 含关键词或正则的 GeoSite 使用 Classical YAML，以保留完整匹配语义。
; 兼容处理：保留策略与顺序；测速组仅使用当前转换器支持的 interval；
; SRC-PORT,41641 不输出，避免依赖仅较新 Beta 才支持的源端口规则。
;Custom_Stash_Rules
;Stash 订阅转换模板
;作者：https://github.com/Aethersailor
;项目地址：https://github.com/Aethersailor/Custom_Stash_Rules
;基于 ACL4SSR 模板魔改而来，感谢原作者！

;本模板为 Full 模板，可以自由添加规则和分组，无性能考量，较为臃肿

