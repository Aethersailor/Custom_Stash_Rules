; Custom_Stash_Rules：归档前最后一次配置校正，不再自动生成或同步。
; COCR 策略基准：cfg/Custom_Clash_GFW.ini @ 59d73a28307a37c6fcf3b0dc547ed19bd33f5959
; GeoSite 与 GEOIP 使用 jsDelivr 远程规则；域名/IP 优先使用 MRS，
; 含关键词或正则的 GeoSite 使用 Classical YAML，以保留完整匹配语义。
; 兼容处理：保留策略与顺序；测速组仅使用当前转换器支持的 interval；
; SRC-PORT,41641 不输出，避免依赖仅较新 Beta 才支持的源端口规则。
;Custom_Stash_Rules
;Stash 订阅转换模板
;作者：https://github.com/Aethersailor
;项目地址：https://github.com/Aethersailor/Custom_Stash_Rules
;基于 ACL4SSR 模板魔改而来，感谢原作者！

[custom]
;设置规则标志位
;以下规则，按照从上往下的顺序遍历，优先命中上位规则，规则重复无影响
;修改顺序会影响分流效果
ruleset=🚀 手动选择,clash-domain:https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/gfw.mrs,28800
ruleset=🚀 手动选择,clash-ipcidr:https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/telegram.mrs,28800|no-resolve
ruleset=🚀 手动选择,clash-ipcidr:https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/facebook.mrs,28800|no-resolve
ruleset=🚀 手动选择,clash-ipcidr:https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/twitter.mrs,28800|no-resolve
ruleset=🎯 全球直连,[]FINAL
;设置规则标志位结束

;设置节点分组标志位
custom_proxy_group=🚀 手动选择`select`[]♻️ 自动选择`.*
custom_proxy_group=♻️ 自动选择`url-test`.*``300
custom_proxy_group=🎯 全球直连`select`[]DIRECT
;设置分组标志位

;下方参数请勿修改
enable_rule_generator=true
overwrite_original_rules=true
